name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source-run-id:
        description: 'Original Release run whose verified artifacts should be retried'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.source-run-id || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      run-id: ${{ steps.source.outputs.run-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve original verified release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        run: node npm/scripts/release-source.mjs

  verify:
    needs: source
    if: github.event_name == 'push'
    uses: ./.github/workflows/verify.yml

  publish:
    needs: [source, verify]
    if: >-
      !cancelled() && needs.source.result == 'success' &&
      (needs.verify.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.verify.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install publishing CLI
        run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Publish verified npm packages
        env:
          GITHUB_REF_NAME: ${{ needs.source.outputs.tag }}
        run: node npm/scripts/publish.mjs release-artifacts --publish
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ needs.source.outputs.tag }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
          node npm/scripts/github-assets.mjs "$GITHUB_REF_NAME" release-artifacts
