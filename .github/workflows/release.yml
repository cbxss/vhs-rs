name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source-run-id:
        description: 'Original Release run whose verified artifacts should be retried'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.source-run-id || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      run-id: ${{ steps.source.outputs.run-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve original verified release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        run: node npm/scripts/release-source.mjs

  verify:
    needs: source
    if: github.event_name == 'push'
    uses: ./.github/workflows/verify.yml

  publish:
    needs: [source, verify]
    if: >-
      !cancelled() && needs.source.result == 'success' &&
      (needs.verify.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.verify.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install publishing CLI
        run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Inspect verified crate
        id: crate
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          if [ -f npm/scripts/crate-release.mjs ]; then
            node npm/scripts/crate-release.mjs inspect release-artifacts
          else
            echo "Legacy release: npm/GitHub artifacts only"
          fi
      - name: Install original crate toolchain
        if: steps.crate.outputs.upload == 'true'
        env:
          CRATE_TOOLCHAIN: ${{ steps.crate.outputs.toolchain }}
        run: rustup toolchain install "$CRATE_TOOLCHAIN" --profile minimal
      - name: Select crate authentication
        if: steps.crate.outputs.upload == 'true'
        id: crate-auth-method
        env:
          CARGO_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_PUBLISH_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
          else
            echo "method=oidc" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to crates.io
        if: steps.crate.outputs.upload == 'true' && steps.crate-auth-method.outputs.method == 'oidc'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish verified npm packages
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        # Older release commits only understand GITHUB_REF_NAME. Set it for the
        # child process; GitHub ignores overrides of its reserved variables in env.
        run: GITHUB_REF_NAME="$RELEASE_TAG" node npm/scripts/publish.mjs release-artifacts --publish
      - name: Publish verified Rust crate
        if: steps.crate.outputs.upload == 'true'
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
        run: node npm/scripts/crate-release.mjs publish release-artifacts
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
          fi
          node npm/scripts/github-assets.mjs "$RELEASE_TAG" release-artifacts

  installed:
    needs: [source, publish]
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify published installations
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ -f npm/scripts/verify-published.mjs ]; then
            node npm/scripts/verify-published.mjs release-artifacts
          else
            echo "Legacy release: publication integrity verified by publish job"
          fi
